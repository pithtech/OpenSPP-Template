name: Publish image

# Builds the dev image for the OpenSPP release pinned in .env and publishes it to
# GHCR so participants can `odoo-project pull` instead of building. Runs only in
# the template repository; copies of the template never publish.

on:
  push:
    branches: ["main"]
    paths:
      - "docker/**"
      - ".env"
      - "requirements.txt"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'pithtech/OpenSPP-Template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read image settings from .env
        id: env
        run: |
          echo "openspp_ref=$(grep '^OPENSPP_REF=' .env | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "remote=$(grep '^ODOO_IMAGE_REMOTE=' .env | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          platforms: linux/amd64
          build-args: OPENSPP_REF=${{ steps.env.outputs.openspp_ref }}
          push: true
          tags: |
            ${{ steps.env.outputs.remote }}:${{ steps.env.outputs.openspp_ref }}
            ${{ steps.env.outputs.remote }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
