# Defaults for all prettier-supported languages.
# Prettier will complete this with settings from .editorconfig file.
bracketSpacing: false
printWidth: 120
proseWrap: always
semi: true
trailingComma: "es5"
xmlWhitespaceSensitivity: "strict"
overrides:
  # Marp shows every source line break inside a paragraph, so slide decks keep one line per paragraph.
  - files: "training/**/slides.md"
    options:
      proseWrap: preserve
